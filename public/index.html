<!DOCTYPE html>
<!-- DO NOT EDIT THIS FILE. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Product Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Store Product Inventory</h1>
    <p>CA Lab Exam &middot; Section 3MCA06 &middot; Set C</p>
  </header>

  <main>
    <div class="controls">
      <section class="panel">
        <h2>Quick views</h2>
        <div class="actions">
          <button id="show-all" type="button">Show All Products</button>
          <button id="top-three" type="button">3 Costliest Products</button>
        </div>
      </section>

      <section class="panel">
        <h2>Search by category</h2>
        <form id="search-form" class="inline">
          <select name="category" required>
            <option value="">Choose a category...</option>
            <option value="Electronics">Electronics</option>
            <option value="Stationery">Stationery</option>
            <option value="Kitchen">Kitchen</option>
          </select>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <form id="filter-form" class="inline">
          <label>Stock less than
            <input type="number" name="maxStock" step="1" required>
          </label>
          <button type="submit">Filter</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Product</h2>
        <form id="add-form" class="stack">
        <label>Name
          <input type="text" name="name" required>
        </label>
        <label>Category
          <select name="category" required>
            <option value="">Choose...</option>
            <option value="Electronics">Electronics</option>
            <option value="Stationery">Stationery</option>
            <option value="Kitchen">Kitchen</option>
          </select>
        </label>
        <label>Price
          <input type="number" name="price" step="1" required>
        </label>
        <label>Stock
          <input type="number" name="stock" step="1" required>
        </label>
          <button type="submit">Add Product</button>
        </form>
        <p id="add-status" class="status"></p>
      </section>
    </div>

    <section class="panel results">
      <h2 id="result-title">Results</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
